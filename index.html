<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luna Wang</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;400&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: white; min-height: 100vh; padding-top: 56px; }

    /* ─── NAV ──────────────────────────────────────── */
    nav {
      position: fixed; top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 48px;
      height: 56px;
      border-bottom: 1px solid #e0e0e0;
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .nav-links { display: flex; gap: 40px; }
    .nav-links a {
      font-size: 16px; font-weight: 300;
      letter-spacing: 0.1em; text-transform: uppercase;
      text-decoration: none; color: #666;
      transition: color 0.2s;
    }
    .nav-links a:hover, .nav-links a.active { color: #0a0a0a; }
    .nav-icons { display: flex; gap: 16px; align-items: center; }
    .nav-icons a { display: flex; color: #0a0a0a; text-decoration: none; opacity: 0.4; transition: opacity 0.2s; }
    .nav-icons a:hover { opacity: 1; }
    .nav-icons svg { width: 18px; height: 18px; }

    /* ─── THEME TOGGLE ──────────────────────────── */
    .theme-toggle {
      display: flex; align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border: 1px solid #e0e0e0;
      border-radius: 100px;
      background: transparent;
      color: #666;
      font-family: 'Poppins', sans-serif;
      font-size: 13px; font-weight: 300;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }
    .theme-toggle:hover { border-color: #999; color: #0a0a0a; }
    .theme-toggle .toggle-icon { font-size: 14px; line-height: 1; }

    /* ─── LIGHT THEME ──────────────────────────────── */
    body.light {
      background: #0a0a0a;
    }
    body.light nav {
      background: rgba(10,10,10,0.92);
      border-bottom-color: #1e1e1e;
    }
    body.light .nav-links a { color: #939393; }
    body.light .nav-links a:hover, body.light .nav-links a.active { color: #fff; }
    body.light .nav-icons a { color: #fff; }
    body.light .theme-toggle { border-color: #1e1e1e; color: #939393; }
    body.light .theme-toggle:hover { border-color: #555; color: #f0f0f0; }
    body.light .text-block,
    body.light .intro-line,
    body.light .kw-item,
    body.light .kw-row { color: #f0f0f0; }

    .outer { width: 100%; overflow: hidden; position: relative; background: white; }

    .frame {
      width: 1440px;
      height: 700px;
      transform-origin: top left;
      position: relative;
      background: white;
    }

    .text-block {
      position: absolute;
      left: 128px;
      top: 142px;
      font-family: 'Poppins', sans-serif;
      z-index: 5;
    }

    .intro-line {
      font-size: 16px;
      font-weight: 200;
      color: #232323;
      line-height: 56px;
      white-space: nowrap;
      display: block;
      opacity: 0;
    }

    .kw-row {
      display: block;
      width: calc(1440px - 128px);
      cursor: default;
      user-select: none;
      overflow: hidden;
    }

    .kw-item {
      display: inline-block;
      font-size: 48px;
      font-weight: 400;
      color: #232323;
      line-height: 68px;
      white-space: nowrap;
      will-change: transform;
      transform: translateY(100%);
    }

    #imgWrap {
      position: fixed;
      top: 0; left: 0;
      pointer-events: none;
      z-index: 100;
      transform: translate(-50%, -50%);
      visibility: hidden;
      opacity: 0;
    }
    #imgWrap img {
      height: 260px;
      width: auto;
      border-radius: 10px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.15);
      display: block;
    }
  </style>
</head>
<body>

<!-- NAV -->
<nav>
  <div class="nav-links">
    <a href="index.html" class="active">Home</a>
    <a href="#">Projects</a>
    <a href="about.html">About</a>
  </div>
  <button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme">
    <span class="toggle-icon">◐</span><span class="toggle-label">Light</span>
  </button>
  <div class="nav-icons">
    <!-- LinkedIn -->
    <a href="https://www.linkedin.com/in/luna-zhiyue-wang/" target="_blank" aria-label="LinkedIn">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
    </a>
    <!-- Email -->
    <a href="mailto:lunazhiyuewang@gmail.com" aria-label="Email">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 7l10 7 10-7"/></svg>
    </a>
  </div>
</nav>

<div class="outer" id="outer">
  <div class="frame" id="frame">
    <div class="text-block">
      <span class="intro-line" id="introLine">i design the human layer of intelligent systems. This has taken shape in...</span>
      <div id="kwList">
        <div class="kw-row" data-img="img1.png">
          <span class="kw-item">Money, redesigned</span>
        </div>
        <div class="kw-row" data-img="img2.png">
          <span class="kw-item">When plans fall apart</span>
        </div>
        <div class="kw-row" data-img="img3.png">
          <span class="kw-item">Complexity, made legible</span>
        </div>
        <div class="kw-row" data-img="img1.png">
          <span class="kw-item">Intelligence you can feel</span>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="imgWrap"><img id="floatImg" src="img1.png"></div>

<script>
  // ── Scale frame ───────────────────────────────────────────────────
  var frame = document.getElementById('frame');
  var outer = document.getElementById('outer');

  function scaleFrame() {
    var s = window.innerWidth / 1440;
    frame.style.transform = 'scale(' + s + ')';
    outer.style.height = (700 * s) + 'px';
  }
  scaleFrame();
  window.addEventListener('resize', scaleFrame);

  // ── Clip entrance — 2x duration ───────────────────────────────────
  var intro = document.getElementById('introLine');
  var items = document.querySelectorAll('.kw-item');

  // Intro fade
  gsap.to(intro, { opacity: 1, duration: 1.0, ease: 'power2.out', delay: 0.2 });

  // Clip slide up — each line staggered, 1.4s duration (2x of 0.7)
  items.forEach(function(item, i) {
    gsap.to(item, {
      y: '0%',
      duration: 1.4,
      ease: 'power3.out',
      delay: 0.3 + i * 0.18
    });
  });

  // ── Theme toggle ──────────────────────────────────────────────
  (function() {
    const btn = document.getElementById('theme-toggle');
    const label = btn.querySelector('.toggle-label');
    const icon = btn.querySelector('.toggle-icon');
    let light = false;
    btn.addEventListener('click', function() {
      light = !light;
      document.body.classList.toggle('light', light);
      label.textContent = light ? 'Dark' : 'Light';
      icon.textContent = light ? '◑' : '◐';
    });
  })();

  // ── Text parallax on hover ────────────────────────────────────────
  document.querySelectorAll('.kw-row').forEach(function(row) {
    var textEl = row.querySelector('.kw-item');
    var bounds;

    row.addEventListener('mouseenter', function() {
      bounds = row.getBoundingClientRect();
    });

    row.addEventListener('mousemove', function(e) {
      if (!bounds) bounds = row.getBoundingClientRect();
      var relX = ((e.clientX - bounds.left) / bounds.width - 0.5) * 2;
      gsap.to(textEl, { x: relX * 10, duration: 0.4, ease: 'power2.out' });
    });

    row.addEventListener('mouseleave', function() {
      gsap.to(textEl, { x: 0, duration: 0.5, ease: 'power3.out' });
    });
  });

  // ── GSAP cursor-following image ───────────────────────────────────
  var wrap = document.getElementById('imgWrap');
  var img  = document.getElementById('floatImg');

  var setLeft = gsap.quickTo(wrap, 'left', { duration: 0.35, ease: 'power3' });
  var setTop  = gsap.quickTo(wrap, 'top',  { duration: 0.35, ease: 'power3' });
  var firstEnter = true;

  function onMove(e) {
    if (firstEnter) {
      gsap.set(wrap, { left: e.clientX, top: e.clientY });
      firstEnter = false;
    } else {
      setLeft(e.clientX);
      setTop(e.clientY);
    }
  }

  var fade = gsap.to(wrap, {
    autoAlpha: 1,
    duration: 0.15,
    ease: 'none',
    paused: true,
    onReverseComplete: function() {
      document.removeEventListener('mousemove', onMove);
    }
  });

  document.querySelectorAll('.kw-row').forEach(function(el) {
    el.addEventListener('mouseenter', function(e) {
      img.src = el.getAttribute('data-img');
      firstEnter = true;
      onMove(e);
      fade.play();
      document.addEventListener('mousemove', onMove);
    });
    el.addEventListener('mouseleave', function() {
      fade.reverse();
    });
  });
</script>
</body>
</html>
